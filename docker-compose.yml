services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: sas_dev
      POSTGRES_USER: sas_dev
      POSTGRES_PASSWORD: ${SAS_LOCAL_DB_PASSWORD:-change-me-for-local-only}
    volumes:
      - sas_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sas_dev -d sas_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  sas_postgres:

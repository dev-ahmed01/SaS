# Overlay for one InterServer Ubuntu VPS; base compose is unchanged.
# Usage: docker compose --env-file ops/staging/.env
#        -f ops/staging/compose.yaml -f ops/staging/compose.single-vps.yaml ...
services:
  db:
    build:
      context: ../..
      dockerfile: ops/staging/Dockerfile.postgres
    restart: unless-stopped
    env_file:
      - .env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-tls:/run/postgres-tls:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/var/lib/postgresql/server.crt
      - -c
      - ssl_key_file=/var/lib/postgresql/server.key
      - -c
      - password_encryption=scram-sha-256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    # PostgreSQL listens on private Docker network only; no host port mapping.
    networks:
      - default
  api:
    depends_on:
      db:
        condition: service_healthy
  proxy:
    networks:
      default:
        aliases:
          - ${STAGING_HOST:?Set STAGING_HOST in ops/staging/.env}

volumes:
  postgres_data:

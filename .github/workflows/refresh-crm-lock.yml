name: Refresh CRM web dependency lock
on:
  push:
    branches:
      - feature/crm-fathom-oct22
    paths:
      - .github/workflows/refresh-crm-lock.yml
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: true
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
      - name: Regenerate lockfile for patched Next.js
        working-directory: apps/web
        run: npm install next@15.5.28 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit verified dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json apps/web/package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore(deps): patch Next.js to 15.5.28"
          git push origin HEAD:feature/crm-fathom-oct22

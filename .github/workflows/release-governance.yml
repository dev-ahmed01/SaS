name: Sponsor a Salah release governance preflight

# Manual verification only. Never deploy or send messages from this workflow.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  main-protection-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'
      - name: Fail if required independent review or CI safeguards are missing
        run: python -m app.repository_ruleset check
      - name: State the boundary of this preflight
        run: |
          echo 'Repository governance metadata verified.'
          echo 'This job does not verify staging, restore real data, or authorize production messaging.'

name: One-time SaS Next.js security lockfile refresh
on:
  push:
    branches: [release/staging-preflight-security-hardening]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh-next-lock:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/release/staging-preflight-security-hardening'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: true
          ref: release/staging-preflight-security-hardening
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Update Next.js and refresh full transitive lockfile from npm registry
        working-directory: apps/web
        run: npm install next@15.5.27 --save-exact --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile only when necessary
        run: |
          git add apps/web/package.json apps/web/package-lock.json
          if git diff --cached --quiet; then
            echo "Security dependency lock already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: patch Next.js 15.5.27 with a verified npm lockfile"
          git push origin HEAD:release/staging-preflight-security-hardening
